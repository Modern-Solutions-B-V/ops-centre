model_list:
  - model_name: local
    litellm_params:
      model: openai/qwen3.8:27b
      api_base: http://ms-qr1-host:11434/v1
      api_key: not-needed

  - model_name: default
    litellm_params:
      model: openai/qwen3.8:27b
      api_base: http://ms-qr1-host:11434/v1
      api_key: not-needed

  - model_name: anthropic/claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 120
  stream_timeout: 60
